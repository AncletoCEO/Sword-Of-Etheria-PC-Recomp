# Bloqueante #1 (2026-10-02):
# 0x4c0008-0x4c008c es solo el reset de registros del EE bootstrap.
# 0x4c008c es un "b ." (spin loop) que en PS2 real espera el reschedule del kernel.
# En PS2Recomp no hay otro thread → redirigimos al verdadero arranque del juego
# en 0x4c0218 (thunk_FUN_004dda18), primer código real del juego tras el bootstrap.
[patches]
instructions = [
    { address = 0x4c008c, value = 0x08130086 }
]
# 0x08130086 = j 0x4c0218  (J-type MIPS: op=2, target=0x4c0218>>2=0x130086)

