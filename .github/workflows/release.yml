name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libasound2-dev libpulse-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Checkout and pin PS2Recomp tools (fork)
        run: |
          git clone --recurse-submodules https://github.com/AncletoCEO/Ps2Recomp-of-etheria.git tools-ci
          git -C tools-ci checkout 7364cc68a25b11cf28bfc6c1d29ad011f318fedd

      - name: Build ps2_recomp and ps2_analyzer
        run: |
          cmake -S tools-ci -B tools-ci/out -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build tools-ci/out -j$(nproc)

      - name: Validate scripts and smoke parser
        run: |
          python3 -m py_compile build_release.py game/*.py
          python3 build_release.py --help
          python3 game/smoke_report.py --help

      - name: Validate functions CSV (gate pre-build)
        run: |
          # REGLA: ningun build sin el gate en verde (0 SHADOW / 0 MIDFUNC).
          # El CI no tiene el ELF/ISO: corre los chequeos que no lo requieren
          # (overlaps, starts sombreados). Local, con el ELF, agrega MISSING/MIDFUNC.
          python3 game/validate_csv.py

      - name: Package artifacts
        run: |
          mkdir -p dist/tools/PS2Recomp/out dist/game
          cp tools-ci/out/ps2xRecomp/ps2_recomp tools-ci/out/ps2xAnalyzer/ps2_analyzer dist/tools/PS2Recomp/out/ 2>/dev/null || cp tools-ci/out/*/ps2_* dist/tools/PS2Recomp/out/
          cp build_release.py README.md dist/
          cp -r game/* dist/game/
          tar -czf sword-etheria-tools-linux.tar.gz -C dist .

      - name: Upload asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sword-etheria-tools-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Checkout and pin PS2Recomp tools (fork)
        run: |
          git clone --recurse-submodules https://github.com/AncletoCEO/Ps2Recomp-of-etheria.git tools-ci
          git -C tools-ci checkout 7364cc68a25b11cf28bfc6c1d29ad011f318fedd
        shell: pwsh

      - name: Build ps2_recomp and ps2_analyzer
        run: |
          cmake -S tools-ci -B tools-ci/out -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build tools-ci/out
        shell: pwsh

      - name: Validate scripts and smoke parser
        run: |
          python -m py_compile build_release.py
          python build_release.py --help
          python game/smoke_report.py --help
        shell: pwsh

      - name: Package artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist/tools/PS2Recomp/out, dist/game
          Get-ChildItem tools-ci/out -Recurse -Include ps2_recomp.exe,ps2_analyzer.exe | Copy-Item -Destination dist/tools/PS2Recomp/out/
          Copy-Item build_release.py, README.md dist/
          Copy-Item -Recurse game/* dist/game/
          Compress-Archive -Path dist/* -DestinationPath sword-etheria-tools-windows.zip
        shell: pwsh

      - name: Upload asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sword-etheria-tools-windows.zip
